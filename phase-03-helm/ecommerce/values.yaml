global:
  # IfNotPresent — стандарт; Never — для локальных образов без registry (kind/локальный containerd)
  imagePullPolicy: IfNotPresent

postgres:
  image: postgres:16-alpine
  auth:
    username: postgres
    # Пароль НЕ хранится в чарте. Задаётся при установке:
    #   helm install ... --set postgres.auth.password=<пароль>
    # либо укажите существующий Secret с ключами postgres-password,
    # database-url-orders, database-url-users:
    password: ""
    existingSecret: ""
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # cpu-limit намеренно не задан: троттлинг БД вреднее перерасхода CPU
    limits:
      memory: 512Mi

productService:
  image: product-service
  tag: "1.0"
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

orderService:
  image: order-service
  tag: "1.0"
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

userService:
  image: user-service
  tag: "1.0"
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

frontend:
  image: frontend
  tag: "1.0"
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  # host: shop.example.com — пусто = матчит любой хост
  host: ""
