apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.productService.replicas }}
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        {{- include "ecommerce.labels" . | nindent 8 }}
    spec:
      containers:
        - name: product-service
          image: {{ .Values.productService.image }}:{{ .Values.productService.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.productService.port }}
          env:
            - name: PORT
              value: {{ .Values.productService.port | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.productService.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.productService.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.productService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
    {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  selector:
    app: product-service
  ports:
    - port: {{ .Values.productService.port }}
      targetPort: {{ .Values.productService.port }}
